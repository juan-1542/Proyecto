<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Proveedor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        .delete-button {
            background-color: #f44336;
            margin-top: 10px;
        }

        .delete-button:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Editar Proveedor</h2>
    <form th:action="@{/proveedor/editar/{id}(id=${proveedor.id})}" th:object="${proveedor}" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" th:value="${proveedor.nombre}" required>

        <label for="contacto">Contacto</label>
        <input type="text" id="contacto" name="contacto" th:value="${proveedor.contacto}" required>

        <button type="submit">Actualizar</button>
    </form>
    <form th:action="@{/proveedor/eliminar/{id}(id=${proveedor.id})}" method="get">
        <button type="submit" class="delete-button">Eliminar</button>
    </form>
</div>
</body>
</html>
