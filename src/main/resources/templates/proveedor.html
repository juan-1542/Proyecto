<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proveedores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4CAF50;
            font-size: 2.5em;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .button-container button {
            padding: 12px 25px;
            font-size: 16px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .button-container button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }

        td {
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .btn {
            padding: 8px 12px;
            font-size: 14px;
            color: white;
            border: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-editar {
            background-color: #28a745;
        }

        .btn-editar:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        .btn-eliminar {
            background-color: #dc3545;
        }

        .btn-eliminar:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #4CAF50;
        }

        .modal-body input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
        }

        .modal-footer button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .modal-footer .btn-registrar {
            background-color: #4CAF50;
            color: white;
        }

        .modal-footer .btn-registrar:hover {
            background-color: #45a049;
        }

        .modal-footer .btn-cerrar {
            background-color: #dc3545;
            color: white;
        }

        .modal-footer .btn-cerrar:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gestión de Proveedores</h2>

    <div class="button-container">
        <button onclick="openModal()">Registrar Proveedor</button>
    </div>

    <h3>Lista de Proveedores</h3>
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Contacto</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="proveedor : ${proveedores}">
            <td th:text="${proveedor.nombre}"></td>
            <td th:text="${proveedor.contacto}"></td>
            <td>
                <a href="/proveedor/editar/{id}" th:href="@{/proveedor/editar/{id}(id=${proveedor.id})}" class="btn btn-editar">Editar</a>
                <a href="/vehiculo" class="btn btn-editar">Vehículos</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div id="modalRegistro" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            Registrar Proveedor
        </div>
        <div class="modal-body">
            <form action="/proveedor/registro" method="POST">
                <input type="text" name="nombre" placeholder="Nombre del Proveedor" required>
                <input type="text" name="contacto" placeholder="Contacto del Proveedor" required>
                <div class="modal-footer">
                    <button type="submit" class="btn-registrar">Registrar</button>
                    <button type="button" class="btn-cerrar" onclick="closeModal()">Cerrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openModal() {
        document.getElementById("modalRegistro").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modalRegistro").style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById("modalRegistro")) {
            closeModal();
        }
    }
</script>

</body>
</html>
