<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Vehículo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            margin-top: 50px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
            color: #555;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-volver {
            background-color: #6c757d;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            display: block;
            text-align: center;
            width: 100%;
        }

        .btn-volver:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Editar Vehículo</h1>

    <form th:action="@{/vehiculos/editar/{id}(id=${vehiculo.id})}" method="post">
        <label for="marca">Marca:</label>
        <input type="text" id="marca" name="marca" th:value="${vehiculo.marca}" required>

        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" name="modelo" th:value="${vehiculo.modelo}" required>

        <label for="ano">Año:</label>
        <input type="number" id="ano" name="ano" th:value="${vehiculo.ano}" required>

        <label for="precio">Precio:</label>
        <input type="number" id="precio" name="precio" th:value="${vehiculo.precio}" required>

        <button type="submit">Actualizar Vehículo</button>
    </form>

    <a href="/vehiculos" class="btn-volver">Volver a la lista de vehículos</a>
</div>
</body>
</html>
